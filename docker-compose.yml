# docker-compose.yml
# --------------------
# 운영 준비 구성: PostgreSQL(db) + Redis(redis) + FastAPI(api) +
# 스케줄러(scheduler) + React+Nginx(web).
#
# 실행:
#   docker compose up --build
#
# api 컨테이너는 시작할 때
#   1) alembic upgrade head        (2순위에서 검증한 초기 마이그레이션 적용)
#   2) python scripts/init_db.py   (역할/권한/기본 admin 계정/플랫폼/창고 시딩,
#                                    이미 존재하면 각 단계가 알아서 건너뜀)
#   3) uvicorn 기동
# 순서로 동작하므로, 최초 실행만으로 로그인 가능한 상태(admin / ChangeMe!123 -
# 로그인 후 반드시 변경)까지 준비된다. scheduler 컨테이너는 동일 이미지로
# scheduler/scheduler.py(APScheduler)만 별도 프로세스로 띄운다 - api가 요청을
# 처리하는 동안 배치 작업이 API 응답 지연에 영향을 주지 않도록 분리했다.
#
# redis는 이번 5순위 작업 범위상 "운영 스택 구성요소로 함께 기동"까지만
# 다룬다 - 현재 애플리케이션 코드는 아직 Redis를 사용하지 않는다(캐시/세션
# 등에 실제로 연결하는 것은 새 기능 추가에 해당해 이번 범위에서 제외했다).
# 추후 캐시/세션 스토어가 필요해지면 이 컨테이너를 그대로 재사용하면 된다.
#
# DB/JWT/암호화키는 리터럴 데모값을 두지 않는다 - 아래 ${VAR:?...} 문법은 해당
# 환경변수가 .env(또는 셸 환경)에 없으면 `docker compose config`/`up` 자체가
# 즉시 오류로 실패한다(데모 기본값으로 조용히 폴백하지 않음, fail-closed).
# 실제 값은 저장소 밖 .env 파일로만 주입한다(.env.example 참고, 배포 절차는
# DEPLOYMENT.md 참고). DATABASE_URL은 POSTGRES_PASSWORD와 문자열로 결합하지
# 않고 완성된 연결 문자열 전체를 별도 필수값으로 받는다 - 비밀번호에 URL
# 예약문자(@, :, / 등)가 섞이면 그 자리에서 조합한 URL이 깨질 수 있어서다.
# .env를 준비할 때 두 값(POSTGRES_PASSWORD와 DATABASE_URL 안의 비밀번호)이
# 서로 일치하도록 사용자가 직접 맞춰야 한다.

services:
  db:
    image: postgres:16-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_db
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - erp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - erp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    # API_IMAGE 미설정 시 `shopping_erp-api`(compose 프로젝트명-서비스명 기본
    # 규칙, 기존 개발용 docker compose build/up과 완전히 동일)로 폴백한다.
    # 운영에서는 .env에 API_IMAGE=shopping_erp_candidate/api:<태그>를 넣어
    # immutable candidate 이미지를 명시적으로 고정한다 - base compose 파일만
    # 다시 적용해도(override 없이) 이 값이 그대로 선택되어, migration은
    # 새 이미지로 실행했는데 컨테이너 재기동 시 구 이미지로 되돌아가는
    # 사고(2026-09-11 API 크래시 루프 원인)를 구조적으로 막는다. `:-`는
    # 값이 비어 있어도(빈 문자열) 기본값으로 폴백한다 - 실수로 빈 줄만
    # 남겨도 안전하게 개발용 기본값을 쓴다(DEPLOYMENT.md 참고).
    image: ${API_IMAGE:-shopping_erp-api}
    container_name: erp-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      DEBUG: "false"
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && python scripts/init_db.py && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - erp_logs:/app/logs
      - erp_backup:/app/backup
      - erp_reports:/app/reports

  scheduler:
    build: .
    # SCHEDULER_IMAGE 미설정 시 `shopping_erp-scheduler`로 폴백한다(api와 동일한
    # 원리 - 위 api 서비스 주석 참고). 운영에서는 SCHEDULER_IMAGE를 API_IMAGE와
    # 반드시 같은 커밋의 candidate 태그로 맞춰야 한다 - scripts/verify_deploy_images.py로
    # 배포 절차에서 이 둘이 다른 커밋을 가리키면 즉시 탐지한다(DEPLOYMENT.md 참고).
    image: ${SCHEDULER_IMAGE:-shopping_erp-scheduler}
    container_name: erp-scheduler
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      DEBUG: "false"
      # PostgreSQL 예약 백업(services/postgres_backup_service.py, 상용 ERP 확장) -
      # 기본 false. api/web에는 이 플래그·마운트를 두지 않는다(백업은 scheduler만
      # 수행한다). 활성화 절차·호스트 ACL 설정은 DEPLOYMENT.md 참고.
      POSTGRES_BACKUP_ENABLED: ${POSTGRES_BACKUP_ENABLED:-false}
      POSTGRES_BACKUP_RETENTION_COUNT: ${POSTGRES_BACKUP_RETENTION_COUNT:-5}
      POSTGRES_BACKUP_TIMEOUT_SECONDS: ${POSTGRES_BACKUP_TIMEOUT_SECONDS:-600}
      # 재기동 후 놓친 예약 백업 보충(fix/postgres-backup-missed-run-recovery) -
      # 기본 false. config/settings.py에 필드만 있고 여기서 전달하지 않으면
      # 운영 .env에 값을 넣어도 컨테이너 안에서는 항상 기본값(false)만 보여
      # 기능이 켜지지 않는다 - POSTGRES_BACKUP_ENABLED와 마찬가지로 scheduler
      # 에만 전달한다(api/web/db/redis에는 두지 않는다 - 보충 실행도 scheduler만
      # 수행한다).
      POSTGRES_BACKUP_CATCHUP_ENABLED: ${POSTGRES_BACKUP_CATCHUP_ENABLED:-false}
    command: python scheduler/scheduler.py
    volumes:
      - erp_logs:/app/logs
      - erp_backup:/app/backup
      - erp_reports:/app/reports
      # PostgreSQL 백업 파일 전용 디렉터리 - api/web에는 마운트하지 않는다. 기본값은
      # 저장소 내부 상대경로(이미 .gitignore의 backup/*/ 규칙에 포함되어 커밋되지
      # 않는다)라 POSTGRES_BACKUP_HOST_DIR을 설정하지 않아도 위험한 루트 경로가
      # 되지 않는다. 실제로 기능을 켤 때는 저장소 밖의 ACL 제한된 Windows 호스트
      # 디렉터리를 이 변수로 지정해야 한다(DEPLOYMENT.md 참고).
      - ${POSTGRES_BACKUP_HOST_DIR:-./backup/postgres}:/app/backup/postgres

  web:
    build: ./frontend
    # WEB_IMAGE 미설정 시 `shopping_erp-web`로 폴백한다(api/scheduler와 동일한
    # 원리). web은 api/scheduler와 독립적으로 배포될 수 있으므로(정적 파일만
    # 서빙, DB migration과 무관) 같은 커밋일 필요는 없지만, revision 라벨은
    # 배포 절차에서 별도로 확인한다(DEPLOYMENT.md 참고).
    image: ${WEB_IMAGE:-shopping_erp-web}
    container_name: erp-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  erp_pg_data:
  erp_redis_data:
  erp_logs:
  erp_backup:
  erp_reports:
