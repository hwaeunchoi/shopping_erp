[alembic]
# NOTE: Keep this file ASCII-only. alembic 1.13.x reads config with
# encoding="locale" (Python's PEP 597 sentinel), which always resolves to
# the OS's raw locale codepage (e.g. cp949 on Korean Windows) regardless of
# PYTHONUTF8/UTF-8 mode. A UTF-8 comment here (e.g. Korean text) breaks
# `alembic` on such systems with UnicodeDecodeError. See README.md for the
# Korean-language Alembic notes instead.

# migration script directory
script_location = migrations

# migration filename format (date_revisionID_description.py)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# timezone for revision file timestamps
timezone = Asia/Seoul

# sqlalchemy.url is overridden dynamically in migrations/env.py from
# config/settings.py's DATABASE_URL, so the value here is only a fallback
# for running bare `alembic` commands without that override.
sqlalchemy.url = sqlite:///erp.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
