# frontend/nginx.conf
# ---------------------
# React SPA 서빙 + /api, /health를 FastAPI 컨테이너(api:8000)로 리버스 프록시.
# docker-compose.yml의 서비스명 "api"가 컨테이너 내부 DNS로 해석된다.
#
# proxy_pass에 호스트명을 직접 쓰면 nginx가 그 IP를 최초 1회(설정 로드/첫 연결 시점)만
# 해석해 캐싱한다 - api 컨테이너를 재생성(재배포)하면 내부 IP가 바뀌는데 nginx는 이를
# 모르고 죽은 IP로 계속 프록시하다 502 Bad Gateway를 낸다. resolver + 변수를 쓰면
# 요청마다(정확히는 resolver valid 주기마다) Docker 내장 DNS(127.0.0.11)로 다시 해석하므로
# api 컨테이너가 재생성돼도 nginx를 재시작할 필요가 없다.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;

    # SPA 라우팅: 알 수 없는 경로는 index.html로 넘겨 react-router-dom이 처리하게 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # proxy_pass에 변수를 쓰면(동적 재해석 대응) nginx가 location 접두사를 자동으로
    # 벗겨내지 않으므로, URI 없이 스킴+호스트만 지정해 원본 요청 경로(/api/... 또는
    # /health)를 그대로 전달해야 한다(URI를 붙이면 경로가 중복돼 404가 난다).
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $api_upstream_health http://api:8000;
        proxy_pass $api_upstream_health;
    }
}
