# .github/workflows/ci.yml
# --------------------------
# Push/PR마다 4순위(개발 품질 향상)에서 구성한 도구들을 그대로 실행한다.
# .pre-commit-config.yaml의 로컬 훅과 동일한 명령/대상 디렉터리를 쓰므로,
# 로컬에서 pre-commit이 통과하면 CI도 통과하는 것이 원칙이다.
#
# 현재 검증·운영 기준 Python은 3.11이다(운영 Dockerfile의 python:3.11-slim, 로컬 검증 환경 3.11).
# CI 필수 gate도 운영 runtime과 같은 3.11을 사용한다.
# 프로젝트 메타데이터(pyproject.toml의 requires-python = ">=3.11")는 상한이 없어 3.14도
# 형식상 허용하지만, 현재 고정 dependency 세트는 Python 3.14에서 설치되지 않아
# (clean 3.14 환경에서 psycopg-binary==3.2.1 설치 실패가 재현됨) 3.14 호환성은 검증되지 않았다.
# 이전에 CI가 3.14를 써서 "Install dependencies" step이 exit code 1로 실패했고(공개 API로 확인된
# 사실은 실패한 step과 exit code뿐이며 상세 로그는 읽지 못했다), 그 뒤의 Ruff/Black/MyPy/Pytest는
# 실행되지 못했다. 3.14 지원은 dependency 갱신과 별도 호환성 검증을 거친 뒤에 선언한다.
# 이 값은 tests/unit/test_ci_workflow_contract.py가 Dockerfile과 일치하는지 검사한다.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: MyPy (type check)
        run: mypy models config core repositories services api integrations scheduler scripts tests

      # tests/integration/*_pg.py의 "러너" 컨테이너가 쓰는 이미지다. clean runner에는 이 이미지가 없고, 없으면
      # docker run이 Docker Hub에서 pull을 시도해 실패한다(pull access denied, exit 125). 로컬 개발 PC에는
      # 예전에 빌드한 이미지가 남아 있어 통과했을 뿐이다. 운영 api 이미지와 같은 Dockerfile·context로 runner
      # 안에서만 빌드한다(registry login·pull·push 없음, build-arg·secret 없음).
      - name: Build integration test runner image
        run: docker build -t shopping_erp-api:latest .

      - name: Pytest
        run: pytest -q

  # frontend 품질 게이트. backend job(quality)과 완전히 독립이다: 별도 runner, Docker·PostgreSQL 미사용,
  # deploy·SSH·이미지 push·migration 단계 없음. 모든 단계는 실패하면 job 이 실패한다(continue-on-error·조건부 skip 금지).
  #
  # Node 버전 근거: 저장소의 공식 Node 설정은 frontend/Dockerfile 의 node:20 뿐이다(.nvmrc·engines 없음).
  # 그런데 `npm test`(node --test 로 TypeScript 테스트 직접 실행)는 Node 22.18+(type stripping 기본 활성)가
  # 필요하고 Node 20 에서는 ERR_UNKNOWN_FILE_EXTENSION 으로 실패한다(2026-10-15 Node 20.19.5 로 확인).
  # 그래서 검사는 Node 22 에서, 운영 이미지와 같은 Node 20 에서는 production build 를 한 번 더 확인한다.
  frontend-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (tests)
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (lockfile as-is)
        run: npm ci

      - name: Lockfile unchanged by install
        run: git diff --exit-code -- package.json package-lock.json

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc -b

      # pretest 가 dist 를 지우고 clean production build 를 수행한 뒤 테스트를 실행한다
      # (bundle 크기·mock/test/axe 미포함·Secret/운영값 미포함 검사 포함).
      - name: Test (clean production build + bundle checks + unit tests)
        run: npm test

      - name: Set up Node 20 (production image Node major)
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Production build on the production image Node major
        run: npm run build
