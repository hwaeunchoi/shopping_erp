# .github/workflows/ci.yml
# --------------------------
# Push/PR마다 4순위(개발 품질 향상)에서 구성한 도구들을 그대로 실행한다.
# .pre-commit-config.yaml의 로컬 훅과 동일한 명령/대상 디렉터리를 쓰므로,
# 로컬에서 pre-commit이 통과하면 CI도 통과하는 것이 원칙이다.
#
# Python 버전은 운영 이미지(Dockerfile의 python:3.11-slim)와 로컬 검증 환경(3.11)에
# 맞춘 3.11이다. 이전에는 3.14를 썼지만 requirements.txt의 psycopg[binary]==3.2.1에는
# Python 3.14용 wheel이 없어(3.2.10부터 존재) "Install dependencies" 단계에서
# 실패했고, 그 뒤의 Ruff/Black/MyPy/Pytest는 한 번도 실행되지 못했다.
# Python 3.14는 프로젝트가 선언한 지원 대상이 아니다(requires-python >= 3.11, 운영
# 이미지 3.11). 3.14를 지원하려면 운영 DB 드라이버를 올리고 별도 호환성 job으로
# 검증해야 하며, 그 전에는 필수 gate로 두지 않는다.
# 이 값은 tests/unit/test_ci_workflow_contract.py가 Dockerfile과 일치하는지 검사한다.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: MyPy (type check)
        run: mypy models config core repositories services api integrations scheduler scripts tests

      - name: Pytest
        run: pytest -q

  # frontend 품질 게이트. backend job(quality)과 완전히 독립이다: 별도 runner, Docker·PostgreSQL 미사용,
  # deploy·SSH·이미지 push·migration 단계 없음. 모든 단계는 실패하면 job 이 실패한다(continue-on-error·조건부 skip 금지).
  #
  # Node 버전 근거: 저장소의 공식 Node 설정은 frontend/Dockerfile 의 node:20 뿐이다(.nvmrc·engines 없음).
  # 그런데 `npm test`(node --test 로 TypeScript 테스트 직접 실행)는 Node 22.18+(type stripping 기본 활성)가
  # 필요하고 Node 20 에서는 ERR_UNKNOWN_FILE_EXTENSION 으로 실패한다(2026-10-15 Node 20.19.5 로 확인).
  # 그래서 검사는 Node 22 에서, 운영 이미지와 같은 Node 20 에서는 production build 를 한 번 더 확인한다.
  frontend-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (tests)
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (lockfile as-is)
        run: npm ci

      - name: Lockfile unchanged by install
        run: git diff --exit-code -- package.json package-lock.json

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc -b

      # pretest 가 dist 를 지우고 clean production build 를 수행한 뒤 테스트를 실행한다
      # (bundle 크기·mock/test/axe 미포함·Secret/운영값 미포함 검사 포함).
      - name: Test (clean production build + bundle checks + unit tests)
        run: npm test

      - name: Set up Node 20 (production image Node major)
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Production build on the production image Node major
        run: npm run build
